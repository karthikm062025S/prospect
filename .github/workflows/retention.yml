name: retention

# D3/D11 (docs/plans/cron-mission-2026-09-24/MISSION.md): the free-tier
# retention prune. Once daily, POSTs /api/retention-sweep on the deployed
# app; the route always computes would-delete + excluded-acted-on counts,
# and only executes the DELETE when BOTH this run is not a dry run AND repo
# variable RETENTION_PRUNE_ENABLED == '1' (Karthik flips it after reading a
# dry-run count, per the prod-db-ops-are-karthiks house rule). Deleting a
# role a user acted on is exactly what the route's NOT EXISTS guard forbids
# (handoff-R4.md) - this workflow only decides dry-run vs real, never the
# predicate.
#
# Requires repo secret WATCHER_SECRET and repo variable PROSPECT_RETENTION_URL
# (no default prod URL - this repo's convention since 2026-09-19: fail loudly
# if unset, never point at the wrong deployment).
#
# D10 outage alerts: a failed sweep opens "Prospect outage: retention" (once
# per episode, silent while open); the next successful run closes it.

on:
  schedule:
    - cron: "13 9 * * *"  # once daily, off-minute, distinct hour from the 3h crons
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = propose only, write nothing (ignored when RETENTION_PRUNE_ENABLED is not '1': the kill switch always wins)"
        default: "0"

permissions:
  contents: read
  issues: write   # opens/closes the outage issue

jobs:
  retention:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: sweep
        env:
          WATCHER_SECRET: ${{ secrets.WATCHER_SECRET }}
          URL: ${{ vars.PROSPECT_RETENTION_URL }}  # required repo variable, no default
          KILL_SWITCH: ${{ vars.RETENTION_PRUNE_ENABLED }}
          DISPATCH_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -eu
          test -n "$URL" || { echo "PROSPECT_RETENTION_URL is not set"; exit 1; }
          if [ "$KILL_SWITCH" != "1" ]; then
            DRY_RUN=1
          elif [ -n "$DISPATCH_DRY_RUN" ]; then
            DRY_RUN="$DISPATCH_DRY_RUN"
          else
            DRY_RUN=0
          fi
          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            -H "X-Watcher-Secret: $WATCHER_SECRET" \
            "$URL?dry_run=$DRY_RUN&days=45")
          cat "$body"
          if [ "$code" != "200" ]; then
            echo "retention sweep: http $code"
            exit 1
          fi
          node -e "
            const r=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));
            if (r.dry_run) console.log('dry run: would_delete '+r.would_delete+', excluded_acted_on '+r.excluded_acted_on+', oldest_created_at '+r.oldest_created_at);
            else console.log('deleted '+r.deleted+', excluded_acted_on '+r.excluded_acted_on+', remaining '+r.remaining);
          " "$body"

      - name: open outage issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Prospect outage: retention"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            echo "outage issue #$num already open, staying quiet"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body "@karthikm062025S - the retention sweep (retention.yml) failed. Run: $run_url"
            echo "opened outage issue"
          fi

      - name: close outage issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Prospect outage: retention"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue close "$num" --repo "$GITHUB_REPOSITORY" --comment "Recovered: the retention sweep ran clean."
            echo "closed outage issue #$num"
          else
            echo "no open outage issue"
          fi
