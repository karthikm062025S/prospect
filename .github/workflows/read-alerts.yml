name: read-alerts

# Deterministic job-alert email ingestion (ADDITIVE to scan.yml — the scanner is
# untouched). Reads a dedicated Gmail label via IMAP + app-password, parses alert
# emails in code (zero LLM tokens), and POSTs survivors to the same /api/watcher
# webhook (dedup + applied-lock server-side). Catches the no-API giants/unicorns
# the ATS scanner structurally can't see. Runs every 3 hours, same cadence as the
# scanner's 2x — but the honest end-to-end floor is ~24h (aggregators are
# daily-digest; see ALERT-SETUP-CHECKLIST.md).
#
# Requires repo secrets: GMAIL_USER, GMAIL_APP_PASSWORD, WATCHER_SECRET.
# Required repo variable SCOUT_WEBHOOK (no default — this is a hackathon repo
# and must never silently fall back to the old Scout production URL,
# 2026-09-19 16:45 fix). Optional repo variable GMAIL_LABEL (default job-alerts).

on:
  schedule:
    # every 3h, off-minute :41, offset from the scanner's :17 slots
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "cap emails processed this run (0 = no cap)"
        default: "0"

permissions:
  contents: read
  issues: write # notify step opens/updates a daily "new drops" issue

jobs:
  read-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install deps (imapflow + mailparser)
        run: npm ci
      - name: read alert emails
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WATCHER_SECRET: ${{ secrets.WATCHER_SECRET }}
          SCOUT_WEBHOOK: ${{ vars.SCOUT_WEBHOOK }}
          GMAIL_LABEL: ${{ vars.GMAIL_LABEL }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: node scripts/read-alerts.mjs --limit "$LIMIT"

      # Notify layer: read-alerts.mjs wrote scripts/last-alerts.json (this run's
      # survivors). If any, @mention Karthik on a per-day issue so GitHub emails
      # him — same channel the scanner uses. Target roles are flagged (TAILOR) so
      # the mandatory km-resume -> km-resume-review rule is visible at a glance.
      - name: notify on new alert drops
        # always() so a partial batch (reader exits 1 on server-side row errors,
        # AFTER writing last-alerts.json) still notifies its successful inserts —
        # otherwise they're skipped now and become non-notifiable updates on retry.
        # File-guarded below, so an early reader failure is a safe no-op.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file=scripts/last-alerts.json
          if [ ! -s "$file" ]; then echo "no alerts file"; exit 0; fi
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$file','utf8')).length)")
          if [ "$count" -eq 0 ]; then echo "no fresh alert drops"; exit 0; fi
          day=$(TZ=America/New_York date +%F)
          title="Scout alerts: new drops — $day"
          body=$(node -e "
            const d=JSON.parse(require('fs').readFileSync('scripts/last-alerts.json','utf8'));
            const lines=d.map(r=>'- **'+r.company+'** — '+r.title+' ['+r.role_type+']'+(r.target?' (TAILOR)':'')+(r.link?' — '+r.link:'')).join('\n');
            console.log('@karthikm062025S — '+d.length+' alert-sourced role(s):\n\n'+lines+'\n\n(TAILOR) = giant/unicorn, resume MUST be tailored (km-resume -> km-resume-review).\n\n→ '+new URL(process.env.SCOUT_WEBHOOK).origin+'');
          ")
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "commented on #$num"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            echo "created issue"
          fi
