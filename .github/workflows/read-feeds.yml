name: read-feeds

# Deterministic public-list feed ingestion (ADDITIVE to scan.yml + read-alerts.yml —
# both untouched). Fetches the public GitHub internship-list READMEs (SimplifyJobs,
# vanshb03, speedyapply), parses the role rows in code (zero LLM tokens), applies a
# small recency window, and POSTs the fresh delta to the same /api/watcher webhook
# (dedup + applied-lock server-side). Catches curated community-list drops that the
# ATS scanner + alert-email ingest don't have yet. Runs every 3h (MISSION D7).
#
# Requires repo secret WATCHER_SECRET. Required repo variable SCOUT_WEBHOOK
# (no default — this is a hackathon repo and must never silently fall back to
# the old Scout production URL, 2026-09-19 16:45 fix).

on:
  schedule:
    # every 3h (MISSION D7, was hourly), off-minute :23 (offset from scan.yml's :07 and read-alerts.yml's :41)
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      since_days:
        description: "recency window in days"
        default: "2"

permissions:
  contents: read

jobs:
  read-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install deps
        run: npm ci

      # Cross-run idempotency: restore the seen-set of role keys already POSTed +
      # notified, so a next-run re-find of the same role isn't re-emailed to Karthik.
      # Rolling-cache pattern: the run-id key never hits (so this run always saves a
      # fresh cache in the post-step), and restore-keys pulls the most recent prior
      # seen-set. If the cache is evicted the set resets → each role re-notifies once
      # (webhook dedup still blocks a duplicate row) — read-feeds.mjs degrades gracefully.
      - name: restore feed seen-set
        uses: actions/cache@v4
        with:
          path: scripts/.feed-seen.json
          key: feed-seen-${{ github.run_id }}
          restore-keys: feed-seen-

      - name: read public list feeds
        env:
          WATCHER_SECRET: ${{ secrets.WATCHER_SECRET }}
          SCOUT_WEBHOOK: ${{ vars.SCOUT_WEBHOOK }}
          SINCE_DAYS: ${{ github.event.inputs.since_days || '2' }}
        run: node scripts/read-feeds.mjs --since-days "$SINCE_DAYS"
