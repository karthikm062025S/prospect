name: heartbeat

# Dead-man's-switch: checks scan.yml's most recent SUCCESSFUL run and alerts if
# it has gone stale. GitHub Actions cron schedules can silently drift or get
# skipped under platform load, so a healthy-looking workflow file is not proof
# the ATS scanner actually ran. This is all heartbeat.yml does now: it never
# scans or notifies of new roles itself (scan.yml, read-feeds.yml and
# read-alerts.yml are untouched by this file).
#
# No repo secrets required beyond the default GITHUB_TOKEN for the heartbeat.
#
# The hot-scan job that used to live here (triggering /api/scan?tier=hot on
# its own 3h schedule) was removed: it duplicated scan.yml's own 3h cadence
# against the same endpoints and burned the DB/Actions quota for no benefit.
# app/api/scan/route.ts is unchanged and still reachable by hand
# (workflow_dispatch or a direct call) if that lane gets a real reason to run
# on its own schedule again.

on:
  schedule:
    - cron: "47 */6 * * *"  # every 6h, off-minute :47 (clear of scan.yml's :07)
  workflow_dispatch:

permissions:
  contents: read  # checkout of the local outage action
  actions: read   # gh run list needs read access to workflow run history
  issues: write   # the one Prospect alert issue (only alert this repo sends)

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check scan.yml freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scan.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt')

          if [ -z "$last" ] || [ "$last" = "null" ]; then
            stale=true
          else
            now_s=$(date -u +%s)
            last_s=$(date -u -d "$last" +%s)
            age_s=$((now_s - last_s))
            if [ "$age_s" -gt $((26 * 3600)) ]; then
              stale=true
            else
              stale=false
            fi
          fi

          if [ "$stale" = "true" ]; then
            echo "scan.yml has not succeeded in more than 26 hours (last success: ${last:-none found}); GitHub Actions cron drift/skips or a real outage"
            exit 1
          fi
          echo "scanner healthy"
      # The ONLY Prospect alert. A dead feed (no green scan.yml in 26h) opens
      # "Prospect outage: heartbeat" once and stays quiet while it is open;
      # the next healthy check closes it. No other workflow opens issues.
      - uses: actions/checkout@v4
        if: always()
        with:
          sparse-checkout: .github/actions
      - name: outage alert
        if: always()
        uses: ./.github/actions/outage
        with:
          name: heartbeat
          status: ${{ job.status }}
