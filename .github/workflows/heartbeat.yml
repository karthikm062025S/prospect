name: heartbeat

# Dead-man's-switch (ADDITIVE — scan.yml, read-feeds.yml, read-alerts.yml all
# untouched by this file). GitHub Actions cron schedules can silently drift or
# get skipped under platform load, so a healthy-looking workflow file is not
# proof the ATS scanner actually ran. This job checks scan.yml's most recent
# SUCCESSFUL run and alerts if it has gone stale — proof the cron ran, not
# just that it exists.
#
# No repo secrets required beyond the default GITHUB_TOKEN for the heartbeat.
#
# L0 (2026-09-19): the hot scan tier moved here from Supabase pg_cron (Lakebase
# has no pg_cron). Every 3 hours (MISSION D7, was 30 min) the `hot-scan` job POSTs /api/scan?tier=hot
# with the watcher secret; the route answers 202 and scans in after(). Requires
# repo secret WATCHER_SECRET; optional repo variable SCOUT_SCAN_URL overrides
# the prod URL. The two schedules are told apart by github.event.schedule.

on:
  schedule:
    - cron: "47 */6 * * *"  # every 6h, off-minute :47 (clear of scan.yml's :07)
    - cron: "13 */3 * * *"  # every 3h (hot scan tier, MISSION D7), off-minute
  workflow_dispatch:

permissions:
  contents: read  # checkout of the local outage action
  actions: read   # gh run list needs read access to workflow run history
  issues: write   # outage issues (D10)

jobs:
  hot-scan:
    if: ${{ github.event.schedule == '13 */3 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: trigger the hot scan tier
        env:
          WATCHER_SECRET: ${{ secrets.WATCHER_SECRET }}
          URL: ${{ vars.SCOUT_SCAN_URL }}  # required repo variable, no default (never the old app)
        run: |
          set -eu
          test -n "$URL" || { echo "SCOUT_SCAN_URL is not set"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "X-Watcher-Secret: $WATCHER_SECRET" \
            -H "content-type: application/json" \
            -d '{}' \
            "$URL?tier=hot")
          echo "hot scan: http $code"
          [ "$code" = "202" ]
      - uses: actions/checkout@v4
        if: always()
        with:
          sparse-checkout: .github/actions
      - name: outage alert
        if: always()
        uses: ./.github/actions/outage
        with:
          name: heartbeat hot-scan
          status: ${{ job.status }}

  heartbeat:
    if: ${{ github.event.schedule != '13 */3 * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check scan.yml freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scan.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt')

          if [ -z "$last" ] || [ "$last" = "null" ]; then
            stale=true
          else
            now_s=$(date -u +%s)
            last_s=$(date -u -d "$last" +%s)
            age_s=$((now_s - last_s))
            if [ "$age_s" -gt $((26 * 3600)) ]; then
              stale=true
            else
              stale=false
            fi
          fi

          if [ "$stale" = "true" ]; then
            echo "scan.yml has not succeeded in more than 26 hours (last success: ${last:-none found}); GitHub Actions cron drift/skips or a real outage"
            exit 1
          fi
          echo "scanner healthy"
      # MISSION D10: stale opens "Prospect outage: heartbeat" once and stays
      # quiet while it is open; the next healthy check closes it.
      - uses: actions/checkout@v4
        if: always()
        with:
          sparse-checkout: .github/actions
      - name: outage alert
        if: always()
        uses: ./.github/actions/outage
        with:
          name: heartbeat
          status: ${{ job.status }}
