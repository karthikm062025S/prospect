name: heartbeat

# Dead-man's-switch (ADDITIVE — scan.yml, read-feeds.yml, read-alerts.yml all
# untouched by this file). GitHub Actions cron schedules can silently drift or
# get skipped under platform load, so a healthy-looking workflow file is not
# proof the ATS scanner actually ran. This job checks scan.yml's most recent
# SUCCESSFUL run and alerts if it has gone stale — proof the cron ran, not
# just that it exists.
#
# No repo secrets required beyond the default GITHUB_TOKEN for the heartbeat.
#
# L0 (2026-09-19): the hot scan tier moved here from Supabase pg_cron (Lakebase
# has no pg_cron). Every 30 minutes the `hot-scan` job POSTs /api/scan?tier=hot
# with the watcher secret; the route answers 202 and scans in after(). Requires
# repo secret WATCHER_SECRET; optional repo variable SCOUT_SCAN_URL overrides
# the prod URL. The two schedules are told apart by github.event.schedule.

on:
  schedule:
    - cron: "7 */6 * * *"  # every 6h, off-minute to avoid the hot :00 slot
    - cron: "13,43 * * * *"  # every 30 min (hot scan tier), off-minute
  workflow_dispatch:

permissions:
  actions: read   # gh run list needs read access to workflow run history
  issues: write   # opens/comments the silent-scanner alert issue

jobs:
  hot-scan:
    if: ${{ github.event.schedule == '13,43 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: trigger the hot scan tier
        env:
          WATCHER_SECRET: ${{ secrets.WATCHER_SECRET }}
          URL: ${{ vars.SCOUT_SCAN_URL || 'https://scoutfeed.vercel.app/api/scan' }}
        run: |
          set -eu
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "X-Watcher-Secret: $WATCHER_SECRET" \
            -H "content-type: application/json" \
            -d '{}' \
            "$URL?tier=hot")
          echo "hot scan: http $code"
          [ "$code" = "202" ]

  heartbeat:
    if: ${{ github.event.schedule != '13,43 * * * *' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: check scan.yml freshness
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scan.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt')

          if [ -z "$last" ] || [ "$last" = "null" ]; then
            stale=true
          else
            now_s=$(date -u +%s)
            last_s=$(date -u -d "$last" +%s)
            age_s=$((now_s - last_s))
            if [ "$age_s" -gt $((26 * 3600)) ]; then
              stale=true
            else
              stale=false
            fi
          fi

          if [ "$stale" != "true" ]; then
            echo "scanner healthy"
            exit 0
          fi

          title="Scout heartbeat: scanner silent"
          body="@karthikm062025S — the ATS scanner (scan.yml) has not succeeded in more than 26 hours (last success: ${last:-none found}). The crons need checking — this could be GitHub Actions cron drift/skips."
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
            echo "commented on #$num"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            echo "created issue"
          fi
